name: Weekly Data Refresh

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "weekly-data-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated data
        run: npm run build:data

      - name: Run tests
        run: npm test

      - name: Check for tracked data changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/snapshots/openholidays-europe.json \
            public/generated/dataset.json \
            src/generated/dataset.json \
            src/generated/source-review.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git author
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit refreshed data
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add \
            data/snapshots/openholidays-europe.json \
            public/generated/dataset.json \
            src/generated/dataset.json \
            src/generated/source-review.json
          git commit -m "chore(data): weekly holiday data refresh"

      - name: Push refreshed data
        if: steps.changes.outputs.has_changes == 'true'
        run: git push origin HEAD:${DEFAULT_BRANCH}
